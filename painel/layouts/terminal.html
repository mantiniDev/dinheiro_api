<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout: Terminal</title>
<style>
body{margin:0;background:#050805;color:#39ff6a;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;padding:14px;text-shadow:0 0 6px #39ff6a55}
pre{margin:0;white-space:pre-wrap}.d{color:#1f8a3a}.y{color:#ffd23f;text-shadow:0 0 6px #ffd23f55}.r{color:#ff5555}
.box{white-space:pre-wrap;border:1px solid #1f8a3a;padding:8px 10px;margin:10px 0}.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
button{font:inherit;background:none;border:1px solid currentColor;color:inherit;padding:8px 14px;margin-right:8px}
</style></head><body><pre id="t"></pre>
<div class="box y">!! PEDIDO #a1c0  21:04:12
   "Liberar internet - PC do quarto"
<br><button style="color:#39ff6a">[Y] LIBERAR</button><button class="r">[N] NEGAR</button></div>
<pre class="d" id="log"></pre><pre>pc-gamer:~$ <span class="cur">█</span></pre>
<script>
const bar=(p,w=20)=>"["+"█".repeat(Math.round(p/100*w))+"░".repeat(w-Math.round(p/100*w))+"]";
document.getElementById("t").textContent=
`pc-gamer@painel  ·  link: bluetooth  ·  up 5h12m
──────────────────────────────────────
CPU  ${bar(37)}  37%   71°C
GPU  ${bar(82)}  82%   66°C
RAM  ${bar(64)}  64%   10.2/16 GB
DSK  ${bar(44)}  44%   412/931 GB
NET  ↓ 12.4 MB/s   ↑ 0.8 MB/s   ping 14ms
──────────────────────────────────────
TOP  chrome.exe ......... 1840 MB
     game.exe ........... 1620 MB
     discord.exe ......... 410 MB`;
document.getElementById("log").textContent=
`[20:58:31] acao  bloquear_tela ........ ok
[20:41:07] pedido "backup" .... LIBERADO
[20:12:55] alerta RAM 91% ..... enviado
[19:30:02] conectado: bluetooth`;
</script></body></html>
